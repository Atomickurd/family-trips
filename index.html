<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="light" style="color-scheme:light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F2EC">
<title>קרקוב 30.11–4.12</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="קרקוב">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
<style id="app-css">
:root{
  --bg:#F6F2EC; --surface:#FFFFFF; --surface2:#EEE7DE; --ink:#2C2930; --ink2:#6F6973; --line:#E4DCD1;
  --pine:#9B2C2C; --pine-soft:#F6E3E1; --lake:#2F4E78; --lake-soft:#E3EAF4; --larch:#B07C1E; --larch-soft:#F6ECD6;
  --alp:#2F6B4F; --alp-soft:#E1EFE7;
  --ok:#3E7A55; --ok-soft:#E2EFE6; --warn:#A5680F; --warn-soft:#F6ECD6; --off:#B5382C; --off-soft:#F8E2DE;
  --serif:"Bellefair","Frank Ruhl Libre","David",serif;
  --sans:"Assistant","Segoe UI","Arial Hebrew",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--lake)}
button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
header.top::after{content:"";display:block;height:3px;background:linear-gradient(to left,var(--pine) 0 40%,var(--larch) 40% 70%,var(--alp) 70% 88%,var(--lake) 88%)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.1;flex:1}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--ink2);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;background:var(--surface2);color:var(--ink2);border:0;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.off{background:var(--off-soft);color:var(--off)} .pill.wait{background:var(--warn-soft);color:var(--warn)}

/* tabs */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{background:none;border:0;padding:8px 1px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink2);cursor:pointer;min-height:56px}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--pine);font-weight:600}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,.nav-btn:focus-visible{outline:2px solid var(--larch);outline-offset:2px}

/* day strip */
.strip{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 10px;scrollbar-width:none;margin:0 -16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,70px));z-index:15;background:var(--bg);box-shadow:0 6px 10px -10px rgba(46,59,54,.35)}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;text-align:center;cursor:pointer;min-width:52px}
.chip b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.1}
.chip span{font-size:11.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.chip[aria-pressed="true"] span{color:#F6E3E1}
.chip.today{border-color:var(--alp);border-width:2px}

.dayhead{padding:14px 0 6px}
.dayhead .when{font-size:14px;color:var(--larch);font-weight:600}
.dayhead h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.15;margin:2px 0 8px}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--ink2)}
.facts span strong{color:var(--ink);font-weight:500}
.wx{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--lake-soft);padding:11px 13px}
.wx-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--lake);font-weight:600}
.wx-h small{font-weight:400;color:var(--ink2);font-size:11.5px}
.wx-m{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-top:4px}
.wx-t{font-family:var(--serif);font-size:30px;line-height:1.1;direction:ltr;font-variant-numeric:tabular-nums}
.wx-t i{font-style:normal;font-size:18px;color:var(--ink2)}
.wx-c{font-size:15px;font-weight:600}
.wx-d{font-size:13px;color:var(--ink2);margin-top:4px}
.wx-n{font-size:13.5px;margin-top:6px;line-height:1.4}
.wx.clim{background:var(--surface2)}
.wx.clim .wx-h{color:var(--ink2)}
.wx-r{padding:8px 0 2px;border-top:1px solid rgba(63,127,150,.18)}
.wx-r:first-of-type{border-top:0}
.wx-p{font-size:14px;font-weight:600;color:var(--ink)}
.wx-p small{font-weight:400;color:var(--ink2);font-size:12px}
.wx-r .wx-t{font-size:26px}
.wx-r.none .wx-n{color:var(--ink2);margin-top:2px}
.wx-r.clim .wx-p{color:var(--ink2)}
.wx-all{border-top:1px solid rgba(63,127,150,.18);padding-top:8px;margin-top:8px}
.wx.none{background:var(--surface2);color:var(--ink2);font-size:13.5px}

/* timeline */
.tl{list-style:none;margin:14px 0 0;padding:0;position:relative}
.tl::before{content:"";position:absolute;top:6px;bottom:6px;right:62px;width:2px;background:var(--line)}
.ev{display:grid;grid-template-columns:56px 1fr;gap:0 18px;padding:0 0 16px;position:relative}
.ev .t{font-size:13px;font-weight:600;color:var(--ink2);direction:ltr;text-align:right;font-variant-numeric:tabular-nums;padding-top:2px;line-height:1.25;word-break:break-word}
.ev::after{content:"";position:absolute;right:58px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--ink2)}
.ev.st-confirmed::after{border-color:var(--ok);background:var(--ok)}
.ev.st-pending::after{border-color:var(--warn)}
.ev.now::after{border-color:var(--larch);background:var(--larch);box-shadow:0 0 0 4px var(--larch-soft)}
.ev .c h3{margin:0;font-size:16px;font-weight:600;line-height:1.35}
.ev .c p{margin:3px 0 0;font-size:14px;color:var(--ink2)}
.ev.now .c h3{color:var(--larch)}
.badge{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;margin-inline-start:6px;vertical-align:2px}
.b-confirmed{background:var(--ok-soft);color:var(--ok)} .b-pending{background:var(--warn-soft);color:var(--warn)}
.b-optional{background:var(--surface2);color:var(--ink2)} .b-backup{background:var(--lake-soft);color:var(--lake)} .b-dropped{background:var(--off-soft);color:var(--off)}
.navs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nav-btn{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:13px;font-weight:500;border-radius:9px;padding:6px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.nav-btn svg{width:15px;height:15px}
.nav-btn.waze{background:var(--lake-soft);border-color:transparent;color:var(--lake)}
.opts{margin-top:8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.opt{display:flex;gap:12px;padding:9px 12px;border-top:1px solid var(--line);align-items:flex-start}
.opt:first-child{border-top:0}
.o-t{flex:0 0 auto;font-weight:600;font-size:15px;color:var(--pine);font-variant-numeric:tabular-nums;min-width:108px}
.o-d{flex:1;min-width:0;line-height:1.35}
.o-d b{display:block;font-weight:600;font-size:14px}
.o-d small{display:block;font-size:12.5px;color:var(--ink2)}
.o-d small.o-p{color:var(--warn);font-weight:600}
.ck{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ck:last-of-type{border-bottom:0}
.ck input{width:22px;height:22px;margin:0;accent-color:var(--pine);flex:0 0 auto}
.ck label{flex:1;cursor:pointer;font-size:15.5px}
.ck.done label{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ink2)}
.ck .del{padding:8px;margin:-4px -6px -4px 0}
.ck-g{font-size:12.5px;font-weight:600;color:var(--larch);margin:10px 0 0}
.ck-g:first-child{margin-top:0}
.ck-n{font-family:var(--sans);font-size:15px;color:var(--ink2);font-weight:400}
.ck-add{display:flex;gap:8px;margin-top:10px}
.ck-add input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.ck-add button{border:0;border-radius:10px;background:var(--pine-soft);color:var(--pine);font-weight:600;padding:0 14px;cursor:pointer}
.badge-btn{border:0;background:none;padding:0;margin:0;cursor:pointer;display:inline-flex;align-items:center;vertical-align:2px}
.badge-btn .badge{margin-inline-start:6px}
.badge-btn .chev{font-size:11px;color:var(--ink2);margin-inline-start:3px}
.st-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.st-opts button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:16px;cursor:pointer;text-align:start}
.st-opts button[aria-pressed="true"]{border:2px solid var(--pine)}
.st-opts .badge{margin:0}
.ev.choice .c{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.ev.choice.unset .c{border:1.5px dashed var(--larch);background:var(--larch-soft)}
.ev.choice.lone .c{background:var(--surface2);border-style:dashed}
.ev.choice.lone .ch-btn{background:var(--ink2)}
.ch-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.ch-tag{font-size:12px;font-weight:600;color:var(--larch)}
.ch-btn{border:0;border-radius:999px;background:var(--larch);color:#fff;font-weight:600;font-size:13px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.ch-others{margin-top:8px;font-size:12.5px;color:var(--ink2)}
.ch-list{display:flex;flex-direction:column;gap:8px;margin:4px 0 10px}
.ch-opt{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--bg);text-align:start;width:100%;cursor:pointer;display:block;font:inherit;color:inherit}
.ch-opt[aria-pressed="true"]{border:2px solid var(--pine);background:var(--pine-soft)}
.ch-opt b{display:block;font-size:15.5px;font-weight:600}
.ch-opt span:not(.badge){display:block;font-size:13px;color:var(--ink2);margin-top:2px}
.ch-opt .ch-sel{font-size:12px;font-weight:600;color:var(--pine);margin-top:4px}
.ch-row{display:flex;gap:6px;align-items:stretch}
.ch-row .ch-opt{flex:1}
.ch-row .del{align-self:center}
.ch-add .field{margin-bottom:8px}
.ch-add h3{font-size:15px;margin:14px 0 8px}
.parks{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pk{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--lake-soft);border-radius:12px;padding:8px 10px}
.pk-ic{flex:0 0 auto;width:26px;height:26px;border-radius:7px;background:var(--lake);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;font-size:15px}
.pk-t{flex:1;min-width:0;line-height:1.3}
.pk-t b{display:block;font-weight:600;font-size:14px}
.pk-t small{display:block;font-size:12px;color:var(--ink2)}
.pk-go{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--lake)}
.pk-go svg{width:15px;height:15px}
.nav-btn.walk{background:var(--larch-soft);border-color:transparent;color:var(--warn)}
.nav-btn.gm{background:var(--pine-soft);border-color:transparent;color:var(--pine)}

/* cards & sections */
.sec-title{font-family:var(--serif);font-weight:400;font-size:28px;margin:20px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.card h3{margin:0;font-size:17px;font-weight:600}
.card .sub{font-size:13px;color:var(--ink2);margin-top:2px}
.card p{margin:8px 0 0;font-size:14px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:10px;font-size:14px}
.kv dt{color:var(--ink2)} .kv dd{margin:0}
.card.tonight{border:2px solid var(--larch)}
.tonight-tag{font-size:12px;font-weight:600;color:var(--larch)}
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:4px 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--pine);color:#fff;border-color:var(--pine)}
.contacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.contacts a{font-size:13px;text-decoration:none;border-radius:8px;padding:4px 9px;background:var(--surface2);color:var(--ink)}
.copy{border:0;background:var(--surface2);border-radius:7px;padding:2px 8px;font-size:12px;cursor:pointer;margin-inline-start:6px}

/* budget */
.meter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.meter .big{font-family:var(--serif);font-weight:400;font-size:46px;line-height:1;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.meter .lbl{font-size:13.5px;color:var(--ink2);margin-top:4px}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:12px;position:relative;display:flex}
.bar i{display:block;height:100%}
.bar .c1{background:var(--lake)} .bar .c2{background:var(--larch)} .bar .over{background:var(--off)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px;vertical-align:0}
.cat{padding:12px 0;border-bottom:1px solid var(--line)}
.cat:last-child{border-bottom:0}
.cat .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cat .name{font-weight:600;font-size:15px}
.cat .amt{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cat .amt.over{color:var(--off);font-weight:600}
.cat .note{font-size:12.5px;color:var(--ink2)}
.cat .bar{height:6px;margin-top:6px}
.mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink2)}
.exp{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.exp:last-child{border-bottom:0}
.exp .e1{flex:1;min-width:0}
.exp .e1 b{font-weight:500;font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp .e1 span{font-size:12.5px;color:var(--ink2)}
.exp .e2{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.exp .e2 b{display:block;font-weight:600}
.exp .e2 span{font-size:12px;color:var(--ink2)}
.pending-tag{font-size:11px;color:var(--warn)}
.del{border:0;background:none;color:var(--ink2);padding:6px;cursor:pointer;border-radius:8px}
.del svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.bk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.bk:last-child{border-bottom:0}
.bk input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok);flex:0 0 auto}
.bk label{flex:1;cursor:pointer}
.bk .n{font-weight:500}
.bk .m{font-size:12.5px;color:var(--ink2)}
.bk.paid .n{color:var(--ink2)}
.fab{position:fixed;left:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:25;border:0;border-radius:999px;background:var(--larch);color:#fff;font-weight:600;font-size:15px;padding:13px 18px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px -6px rgba(0,0,0,.35);cursor:pointer}
.fab svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2}
@media (min-width:672px){.fab{left:calc(50% - 320px + 16px)}}

/* info */
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
details.acc summary{list-style:none;padding:14px;font-weight:600;font-size:16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"";width:9px;height:9px;border-left:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(-45deg);transition:transform .2s}
details.acc[open] summary::after{transform:rotate(135deg)}
.items{padding:0 14px 8px}
.item{padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.item .l{font-size:12.5px;color:var(--ink2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px;cursor:pointer;width:100%;text-align:center;margin-top:8px}
.btn.primary{background:var(--pine);border-color:var(--pine);color:#fff}
.btn.danger{color:var(--off)}
.btn[disabled]{opacity:.55;cursor:default}
.muted{font-size:13px;color:var(--ink2)}
.empty{padding:40px 10px;text-align:center}
.empty h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:0 0 6px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,25,.45);z-index:40;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;transform:translateY(105%);transition:transform .22s ease;max-height:92vh;overflow:auto}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:0 0 12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.field input,.field select{width:100%;font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink)}
.amtrow{display:flex;gap:8px}
.amtrow input{flex:1;direction:ltr;text-align:right;font-size:24px;font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:0 16px;font-size:18px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pine);color:#fff}
.catgrid{display:flex;flex-wrap:wrap;gap:6px}
.catgrid button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.catgrid button[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;display:none}
.toast.show{display:block}
.progress{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--pine);transition:width .3s}
.static-only{display:none}
.fab[hidden]{display:none}
bdi.n{white-space:nowrap}
.arr{color:var(--alp);font-weight:400}

      var defO=liveOpts.length?(liveOpts.find(function(x){return !ALT_RE.test(x.e.title)&&x.e.status!=="backup"})||liveOpts[0]):null;

/* ---------- write queue (offline-first) ---------- */
function enqueue(op){
  if(op.t==="chc"){S.queue=S.queue.filter(function(o){return !(o.t==="chc"&&o.id===op.id)})}
  if(op.t==="chx_del"){var pend=S.queue.some(function(o){return o.t==="chx_add"&&o.id===op.id&&o.data.id===op.oid});
    if(pend){S.queue=S.queue.filter(function(o){return !((o.t==="chx_add"&&o.id===op.id&&o.data.id===op.oid)||(o.t==="chc"&&o.id===op.id&&o.v===op.oid))});LS.set("queue",S.queue);render();return}}
  if(op.t==="rst"){S.queue=S.queue.filter(function(o){return !(o.t==="rst"&&o.id===op.id)})}
  if(op.t==="cap"){S.queue=S.queue.filter(function(o){return o.t!=="cap"});var cp={};cp["cap_"+S.family]=op.v;S.settings=Object.assign({},S.settings,cp);LS.set("settings",S.settings)}
  if(op.t==="paid"||op.t==="rate"){S.queue=S.queue.filter(function(o){return !(o.t===op.t&&o.id===op.id)})}
  if(op.t==="ck_set"){var pa=S.queue.find(function(o){return o.t==="ck_add"&&o.id===op.id});
    if(pa){pa.data=Object.assign({},pa.data,op.v);LS.set("queue",S.queue);render();flush();return}
    S.queue=S.queue.filter(function(o){return !(o.t==="ck_set"&&o.id===op.id)})}
  if(op.t==="ck_del"){var hadc=S.queue.some(function(o){return o.t==="ck_add"&&o.id===op.id});
    S.queue=S.queue.filter(function(o){return !(o.t==="ck_set"&&o.id===op.id)});
    if(hadc){S.queue=S.queue.filter(function(o){return o.id!==op.id});LS.set("queue",S.queue);render();return}}
  if(op.t==="del"){var had=S.queue.some(function(o){return o.t==="add"&&o.id===op.id});
    if(had){S.queue=S.queue.filter(function(o){return o.id!==op.id});LS.set("queue",S.queue);render();return}}
  if(op.t==="rate"){S.settings=Object.assign({},S.settings,{rate:op.v});LS.set("settings",S.settings)}
  S.queue.push(op); LS.set("queue",S.queue); render(); flush();
}
var flushing=false;
async function flush(){
  if(flushing||!S.db||!navigator.onLine||!S.queue.length)return;
  flushing=true;
  try{
    while(S.queue.length){
      var op=S.queue[0];
      try{
        if(op.t==="add") await S.db.collection("expenses").doc(op.id).set(op.data);
        else if(op.t==="del") await S.db.collection("expenses").doc(op.id).delete();
        else if(op.t==="paid"){var p={};p[op.id]=op.v;try{await S.db.doc("trip/paid").update({paid:p})}catch(e){if(e&&e.code==="invalid_argument"){var cur=Object.assign({},S.paid);cur[op.id]=op.v;await S.db.doc("trip/paid").set({paid:cur})}else throw e}}
        else if(op.t==="rate"||op.t==="cap"){var f={};f[op.t==="cap"?"cap_"+S.family:op.t]=op.v;try{await S.db.doc("trip/settings").update(f)}catch(e3){if(e3&&(e3.code==="unavailable"||e3.code==="revoked"))throw e3;await S.db.doc("trip/settings").set(Object.assign({rate:rate()},S.settings,f))}}
        else if(op.t==="chc"||op.t==="chx_add"||op.t==="chx_del"){
          var base=S.choices||{}, patch={};
          if(op.t==="chc"){patch.sel={};patch.sel[op.id]=op.v}
          else{var arr=((base.extra||{})[op.id]||[]).filter(function(o){return o.id!==(op.oid||op.data.id)});if(op.t==="chx_add")arr.push(op.data);patch.extra={};patch.extra[op.id]=arr;
            if(op.t==="chx_del"&&base.sel&&base.sel[op.id]===op.oid){patch.sel={};patch.sel[op.id]=null}}
          try{await S.db.doc("trip/choices").update(patch)}catch(e6){if(e6&&(e6.code==="unavailable"||e6.code==="revoked"))throw e6;
            var full={sel:Object.assign({},base.sel||{},patch.sel||{}),extra:Object.assign({},base.extra||{},patch.extra||{})};await S.db.doc("trip/choices").set(full)}
          var nb={sel:Object.assign({},base.sel||{},patch.sel||{}),extra:Object.assign({},base.extra||{},patch.extra||{})};S.choices=nb;LS.set("chc",nb)}
        else if(op.t==="rst"){var sm={};sm[op.id]=op.v;try{await S.db.doc("trip/rstatus").update({s:sm})}catch(e4){if(e4&&(e4.code==="unavailable"||e4.code==="revoked"))throw e4;var all=Object.assign({},S.rst);all[op.id]=op.v;await S.db.doc("trip/rstatus").set({s:all})}}
        else if(op.t==="ck_add") await S.db.collection("checklist").doc(op.id).set(op.data);
        else if(op.t==="ck_del") await S.db.collection("checklist").doc(op.id).delete();
        else if(op.t==="ck_set"){try{await S.db.collection("checklist").doc(op.id).update(op.v)}catch(e2){var c2=e2&&e2.code;if(c2==="unavailable"||c2==="revoked"||!c2)throw e2;/* item was deleted meanwhile: drop */}}
        S.queue.shift(); LS.set("queue",S.queue);
      }catch(e){
        var code=e&&e.code;
        if(code==="invalid_argument"||code==="transform_error"){S.queue.shift();LS.set("queue",S.queue);S.canWrite=false;toast("אין הרשאה לשמור. בקשו מרועי לבדוק שהמייל ברשימה");}
        else if(code==="quota_exceeded"){S.queue.shift();LS.set("queue",S.queue);toast("האחסון מלא — מחקו הוצאות ישנות")}
        else {S.conn="offline";break}
      }
    }
  } finally { flushing=false; render(); }
}
window.addEventListener("online",function(){if(S.db){S.conn="online";flush()}renderConn()});
window.addEventListener("offline",function(){S.conn="offline";renderConn()});

/* ---------- db wiring (Firebase) ---------- */
window.__onWriteDenied=function(){S.canWrite=false;toast("אין הרשאה לשמור. בקשו מרועי לבדוק שהמייל ברשימה")};
var unsubs=[];
function clearSubs(){unsubs.forEach(function(u){try{u()}catch(e){}});unsubs=[]}
async function doLogin(){
  S.loginErr=""; if(!window.__fb){toast("עוד טוען, נסו שוב בעוד רגע");return}
  try{await window.__fb.login()}catch(e){
    var c=e&&e.code||"";
    if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request")return;
    if(c==="auth/unauthorized-domain")S.loginErr="הכתובת של האתר לא אושרה בהגדרות Firebase.";
    else if(c==="auth/network-request-failed")S.loginErr="אין חיבור לאינטרנט.";
    else if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment")S.loginErr="הדפדפן הזה לא מאפשר התחברות עם Google. מעתיקים את הקישור, פותחים אותו ישירות בספארי או בכרום, ומתחברים משם.";
    else S.loginErr="ההתחברות לא הצליחה ("+c+"). נסו לפתוח בכרום או בספארי.";
    render();
  }
}
function startData(fb){
  var db=fb.db; S.db=db; S.conn=navigator.onLine?"online":"offline";
  function onErr(e){ if(e&&e.code==="invalid_argument"){S.auth="denied";clearSubs();render()} }
  unsubs.push(db.doc("trip/families").onSnapshot(function(s){
    S.fam=s.exists?s.data():null; LS.set("fam",S.fam);
    S.family=(S.fam&&S.fam.members&&S.fam.members[S.email])||null; LS.set("family",S.family); watchFlights(); migrateLegacy(); render();
  },onErr));
  unsubs.push(db.doc("trip/plan").onSnapshot(function(s){
    S.loaded.plan=true;
    if(s.exists){S.plan=s.data();LS.set("plan",S.plan)} else {S.plan=null}
    S.conn=navigator.onLine?"online":"offline"; render(); flush();
  },onErr));
  unsubs.push(db.doc("trip/paid").onSnapshot(function(s){S.paid=(s.exists&&s.data().paid)||{};LS.set("paid",S.paid);render()},onErr));
  unsubs.push(db.doc("trip/settings").onSnapshot(function(s){if(s.exists){S.settings=Object.assign({rate:0.8},s.data());LS.set("settings",S.settings);render()}},onErr));
  unsubs.push(db.doc("trip/weather").onSnapshot(function(s){S.weather=s.exists?s.data():{};LS.set("wx",S.weather);render()},onErr));
  unsubs.push(db.doc("trip/choices").onSnapshot(function(s){S.choices=s.exists?s.data():{};LS.set("chc",S.choices);render()},onErr));
  unsubs.push(db.doc("trip/rstatus").onSnapshot(function(s){S.rst=(s.exists&&s.data().s)||{};LS.set("rst",S.rst);render()},onErr));
  unsubs.push(db.collection("checklist").onSnapshot(function(q){
    S.check=q.docs.map(function(d){return Object.assign({id:d.id},d.data())}); LS.set("chk",S.check); render();
  },onErr));
  unsubs.push(db.collection("expenses").onSnapshot(function(q){
    S.expenses=q.docs.map(function(d){return Object.assign({id:d.id},d.data())}); LS.set("exp",S.expenses); render();
  },onErr));
}
function onFB(fb){
  window.__fb=fb;
  if(fb.noconfig){S.auth="noconfig";render();return}
  fb.onUser(function(u){
    clearSubs(); resetFlights();
    if(!u){S.auth="out";S.email="";S.db=null;S.conn="offline";render();return}
    S.email=String(u.email||"").toLowerCase(); S.auth="in";
    if(S.fam&&S.fam.members)S.family=S.fam.members[S.email]||null;
    render(); startData(fb); watchFlights();
  });
}
window.__onFB=onFB;

/* ---------- offline copy ---------- */
function staticDoc(){
  S._static=true;
  var data={choices:S.choices,rst:rstMap(),plan:S.plan,paid:paidMap(),expenses:expensesView().map(function(e){var c=Object.assign({},e);delete c._pending;return c}),settings:S.settings,weather:S.weather};
  var css=document.getElementById("app-css").textContent;
  var stamp=new Date().toLocaleString("he-IL",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"});
  var radios=TABS.map(function(t,i){return '<input type="radio" name="tb" id="r-'+t.id+'"'+(i===0?" checked":"")+' hidden>'}).join("");
  var labels=TABS.map(function(t){return '<label for="r-'+t.id+'" class="tab" id="l-'+t.id+'">'+t.ic+t.name+'</label>'}).join("");
  var keep=S.tab; 
  var parts={
    day:(S.plan.days||[]).map(function(d){return '<section class="sday">'+dayHTML(d,true)+'</section>'}).join('<hr style="border:0;border-top:1px solid var(--line);margin:18px 0">'),
    budget:viewBudget(true), food:viewFood(true), hotels:viewHotels(true), check:viewCheck(true), info:viewInfo(true)
  };
  S.tab=keep; S._static=false;
  var panes=TABS.map(function(t){return '<div class="pane" id="p-'+t.id+'">'+parts[t.id]+'</div>'}).join("");
  var extra='.pane{display:none}'+TABS.map(function(t){return '#r-'+t.id+':checked~main #p-'+t.id+'{display:block}#r-'+t.id+':checked~nav #l-'+t.id+'{color:var(--lake);font-weight:600}'}).join("")+'.static-note{font-size:12.5px;color:var(--ink2);padding:10px 0}';
  return '<!DOCTYPE html><html lang="he" dir="rtl" data-theme="light" style="color-scheme:light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>קרקוב, עותק אופליין</title><style>'+css+extra+'</style></head><body>'+radios+
   '<header class="top"><div class="top-in"><div class="brand">קרקוב בכריסמס<small>עותק אופליין מ־'+esc(stamp)+'</small></div></div></header>'+
   '<main class="wrap"><p class="static-note">עותק לקריאה בלבד. עדכונים נעשים באפליקציה כשיש אינטרנט.</p>'+panes+'</main>'+
   '<nav class="tabs"><div class="tabs-in">'+labels+'</div></nav>'+
   '<script>window.__OFFLINE__='+JSON.stringify({savedAt:stamp}).replace(/</g,"\\u003c")+'<\/script></body></html>';
}
async function saveOffline(){
  if(!S.plan){toast("אין עדיין נתונים לשמור");return}
  var html=staticDoc(), name="krakow-trip-offline.html";
  var dl=window.claude&&window.claude.use?await window.claude.use("downloads").catch(function(){return null}):null;
  if(dl){try{await dl.save({filename:name,data:new Blob([html],{type:"text/html"})});toast("נשמר. פתחו את הקובץ מהטלפון כשאין קליטה.");return}catch(e){if(e&&e.code==="cancelled")return}}
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("הקובץ ירד")}catch(e){toast("השמירה לא זמינה כאן")}
}

/* ---------- boot ---------- */
render();
if(window.__fbApi)onFB(window.__fbApi);
setInterval(function(){if(S.tab==="day"&&!document.querySelector(".sheet.open"))render()},60000);
})();
</script>
